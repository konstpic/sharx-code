name: Scan a built image with Trivy
description: >
  Blocks the release on fixable HIGH/CRITICAL findings in our own code and the OS packages, and on fixable CRITICAL findings anywhere.
  Third-party binaries bundled into the image (Xray, Telemt, AmneziaWG under bin/) belong to their upstreams: their HIGH findings are
  only reported, because the fix is a new upstream release and not something this repository can build.

inputs:
  image:
    description: Image reference already present in the local Docker daemon
    required: true
  bundled-dirs:
    description: Comma-separated directories that hold third-party binaries inside the image
    default: /app/bin,/opt/sharx-node-embedded/bin

runs:
  using: composite
  steps:
    # 1. Our binaries (x-ui, node-service, balancer) and the OS packages: HIGH and CRITICAL block.
    - name: Trivy — our code and OS packages (HIGH+CRITICAL, blocking)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        skip-dirs: ${{ inputs.bundled-dirs }}
        trivyignores: .trivyignore
        format: table
        exit-code: "1"

    # 2. Anything at all, bundled binaries included: CRITICAL blocks.
    - name: Trivy — whole image (CRITICAL, blocking)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: CRITICAL
        ignore-unfixed: true
        trivyignores: .trivyignore
        format: table
        exit-code: "1"

    # 3. For the record: HIGH findings in the bundled upstream binaries (does not fail the job).
    - name: Trivy — bundled third-party binaries (HIGH, report only)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: HIGH
        ignore-unfixed: true
        format: table
        exit-code: "0"
