name: Go tests

on:
  pull_request:
  push:
    branches: [main]
  # the release workflow runs the same checks first (harbor-release.yml): a tag whose tests or audit fail builds nothing
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: panel
