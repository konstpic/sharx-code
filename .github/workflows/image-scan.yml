name: Image scan

# The same Trivy check the release runs before pushing (.github/actions/trivy-scan), runnable by hand and every Monday: new CVEs
# appear for images that were already released. Nothing is pushed anywhere.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  telemt-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEMT_VERSION: "3.5.7"
    steps:
      - uses: actions/checkout@v5
      - run: |
          chmod +x scripts/download-telemt.sh
          ./scripts/download-telemt.sh amd64
      - uses: actions/upload-artifact@v4
        with:
          name: telemt-sharx-linux-amd64
          path: third_party/telemt-sharx/prebuilt/linux-amd64/telemt

  scan:
    needs: telemt-prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sharx
            file: ./Dockerfile
          - name: sharxnode
            file: ./node/Dockerfile
          - name: sharxbalancer
            file: ./balancer/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: telemt-sharx-linux-amd64
          path: third_party/telemt-sharx/prebuilt/linux-amd64/

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ matrix.name }}-scan:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=scan-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.name }}

      - name: Scan the ${{ matrix.name }} image (Trivy)
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ matrix.name }}-scan:ci
