helpTitle = "Balanceadores"
helpP1 = "Um balanceador é um servidor separado que executa HAProxy ou nginx. Os clientes se conectam ao seu endereço e ele encaminha a conexão a um dos nodes que atendem o mesmo inbound. O tráfego não é descriptografado, então Reality, TLS e os demais protocolos funcionam sem alterações."
helpP2 = "Adicione um balanceador, instale o agente no servidor (docker compose da janela de instalação) e coloque atrás dele os inbounds de que precisa. Os nodes vêm dos nodes atribuídos ao inbound; um node com falha é removido automaticamente da rotação."
