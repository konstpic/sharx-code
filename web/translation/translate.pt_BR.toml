[pages.help.scenes.welcome]
title = "Como o painel funciona"
cap1 = "Nodes são seus servidores. Cada um executa o Xray com inbounds: um protocolo e uma porta."
cap2 = "Um balanceador é um ponto de entrada único na frente de vários nodes. Opcional."
cap3 = "Um host é o que o cliente recebe: o endereço e a porta de um node, de um balanceador ou do seu próprio domínio."
cap4 = "Um pacote é um conjunto ordenado de hosts. O acesso aos inbounds vem dos seus hosts."
cap5 = "Um cliente é colocado em pacotes e recebe uma assinatura com todos os seus hosts."
cap6 = "O cliente se conecta. O balanceador envia o tráfego a um node ativo."
cap7 = "Um node caiu: o tráfego passa para o outro e o cliente não percebe nada."

[pages.help.scenes.inbounds]
title = "Inbounds"
cap1 = "Um inbound é uma forma de conexão: protocolo, porta e configurações de transporte."
cap2 = "Atribua-o a um ou mais nodes: ele será executado em todos eles."
cap3 = "O painel envia a configuração aos nodes e a mantém sincronizada."
cap4 = "Os clientes com acesso se conectam a qualquer node do inbound."

[pages.help.scenes.nodes]
title = "Nodes"
cap1 = "Instale o agente em um servidor: pelo arquivo compose de copiar e colar ou via SSH."
cap2 = "O painel se pareia com o node usando um segredo compartilhado. Toda chamada é assinada."
cap3 = "As configurações de inbound e os clientes vão para o Xray no node."
cap4 = "O node informa seu status e carga, e você os vê na página."
cap5 = "Se um node parar de responder, o painel o marca e pode notificar você."

[pages.help.scenes.balancers]
title = "Balanceadores"
cap1 = "Os clientes se conectam ao balanceador em vez de a um node."
cap2 = "Ele distribui as conexões entre os nodes do inbound."
cap3 = "Um node para de responder: ele é ignorado e os outros assumem a carga."
cap4 = "O gráfico ao vivo mostra a velocidade e as conexões pelo balanceador."
cap5 = "Na assinatura você escolhe: somente balanceador, somente nodes diretos, ou ambos."

[pages.help.scenes.bundles]
title = "Pacotes"
cap1 = "Hosts são as entradas que podem ser entregues a um cliente."
cap2 = "Um pacote lista os hosts em ordem. Essa ordem é a ordem da assinatura."
cap3 = "Os clientes entram no pacote e recebem seus hosts e o acesso aos respectivos inbounds."
cap4 = "Um host oculto não aparece na assinatura, mas ainda concede acesso."
cap5 = "Remova um cliente do pacote e o acesso é retirado nos nodes."

[pages.help.scenes.hosts]
title = "Hosts"
cap1 = "Cada host pertence a exatamente um inbound."
cap2 = "Hosts de node e de balanceador acompanham seus servidores automaticamente. Os hosts de endereço são seus."
cap3 = "Os pacotes colocam os hosts nas assinaturas, em ordem."
cap4 = "Um host desativado desaparece das assinaturas; nada mais muda."

[pages.help.scenes.clients]
title = "Clientes"
cap1 = "Crie um cliente e defina os limites: tráfego, validade, dispositivos."
cap2 = "Escolha os pacotes que o cliente recebe."
cap3 = "O cliente recebe um único link de assinatura."
cap4 = "O aplicativo o importa e mostra todos os servidores dos pacotes."
cap5 = "Quando um limite é atingido, o acesso é interrompido até você estendê-lo."

[pages.help.scenes.groups]
title = "Grupos"
cap1 = "Um grupo é um rótulo para vários clientes."
cap2 = "Defina validade, limites ou pacotes para todo o grupo em uma única ação."
cap3 = "Todo cliente do grupo recebe a alteração."

