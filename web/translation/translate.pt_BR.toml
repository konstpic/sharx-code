helpP4 = "O peso do membro controla quanto tráfego cada node de um pool recebe. Manual: você define um peso fixo por node. Auto: por carga do node: o painel lê a largura de banda de uplink definida pelo admin para cada node (Nodes → editar → Largura de banda de uplink) e sua vazão real informada, e dá mais peso a nodes com folga; um node sem largura de banda definida recebe um peso baixo de fallback em vez de ser excluído. Auto: por ping: o balanceador mede a própria latência de conexão TCP até cada node e dá mais peso a nodes mais próximos/rápidos; um node inacessível também recebe um peso baixo de fallback. Ambos os modos automáticos recalculam por temporizador (Configurações → Geral → Peso automático do balanceador) e sobrescrevem qualquer peso definido manualmente abaixo."

