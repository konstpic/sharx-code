helpP1 = "負載平衡器是一台運行 HAProxy 或 nginx 的獨立伺服器。客戶端連線到它的位址，它再將連線轉送到服務同一入站的其中一個節點。流量不會被解密，因此 Reality、TLS 和其他協議都能原樣運作。"
