helpP4 = "成員權重控制池中每個節點獲得多少流量。手動：由您自行為每個節點設定固定權重。自動：依節點負載：面板讀取管理員為每個節點設定的上行頻寬（節點 → 編輯 → 上行頻寬）及其實際回報的吞吐量，並給有餘裕的節點更高權重；未設定頻寬的節點會得到較低的後備權重，而不是被排除。自動：依延遲：負載平衡器測量自身到每個節點的 TCP 連線延遲，並給更近/更快的節點更高權重；不可達的節點同樣會退回到較低權重。兩種自動模式都會依計時器重新計算（設定 → 一般 → 負載平衡器自動權重），並覆寫您在下方手動設定的任何權重。"

