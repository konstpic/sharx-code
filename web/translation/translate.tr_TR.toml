helpTitle = "Dengeleyiciler"
helpP1 = "Dengeleyici, HAProxy veya nginx çalıştıran ayrı bir sunucudur. İstemciler onun adresine bağlanır ve o bağlantıyı aynı inbound’a hizmet veren düğümlerden birine iletir. Trafiğin şifresi çözülmez, bu yüzden Reality, TLS ve diğer protokoller değişmeden çalışır."
helpP2 = "Bir dengeleyici ekleyin, aracıyı sunucuya kurun (kurulum penceresindeki docker compose), ardından ihtiyacınız olan inbound’ları onun arkasına koyun. Düğümler inbound’a atanmış düğümlerden gelir; arızalı bir düğüm döngüden otomatik çıkarılır."
helpP3 = "Her inbound için aboneliğin neyi göstereceğini seçersiniz: dengeleyici ve doğrudan düğümler birlikte (her iki sırada), yalnızca dengeleyici veya yalnızca doğrudan düğümler."
helpP4 = "Üye ağırlığı, havuzdaki her düğümün ne kadar trafik alacağını belirler. Elle: düğüm başına sabit bir ağırlığı kendiniz belirlersiniz. Otomatik: düğüm yüküne göre: panel, her düğümün yönetici tarafından ayarlanan yükleme bant genişliğini (Düğümler → düzenle → Yükleme bant genişliği) ve bildirilen gerçek verimini okur ve boş kapasitesi olan düğümlere daha fazla ağırlık verir; bant genişliği ayarlanmamış düğüm hariç tutulmak yerine düşük yedek ağırlık alır. Otomatik: ping’e göre: dengeleyici her düğüme kendi TCP bağlantı gecikmesini ölçer ve daha yakın/hızlı düğümlere daha fazla ağırlık verir; ulaşılamayan düğüm de düşük ağırlığa döner. Her iki otomatik mod da bir zamanlayıcıyla yeniden hesaplanır (Ayarlar → Genel → Dengeleyici otomatik ağırlık) ve aşağıda elle belirlediğiniz ağırlıkların üzerine yazar."

