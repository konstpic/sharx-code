cap2 = "バランサーは複数のノードの前に置く1つの入口です。任意です。"
cap3 = "ホストはクライアントに渡されるものです。ノード、バランサー、または独自ドメインのアドレスとポートです。"
cap4 = "バンドルは順序付きのホストの集まりです。インバウンドへのアクセスはそのホストから決まります。"
cap5 = "クライアントはバンドルに入れられ、すべてのホストを含む1つのサブスクリプションを受け取ります。"
cap6 = "クライアントが接続します。バランサーがトラフィックを稼働中のノードへ振り分けます。"
cap7 = "ノードが停止しても、トラフィックはもう一方に移り、クライアントは気づきません。"

[pages.help.scenes.inbounds]
title = "インバウンド"
cap1 = "インバウンドは接続方法です。プロトコル、ポート、トランスポート設定を指します。"
cap2 = "1つ以上のノードに割り当てると、そのすべてで動作します。"
cap3 = "パネルが設定をノードにプッシュし、同期を保ちます。"
cap4 = "アクセス権のあるクライアントは、そのインバウンドのどのノードにも接続できます。"

[pages.help.scenes.nodes]
title = "ノード"
cap1 = "サーバーにエージェントをインストールします。コピー＆ペーストのcomposeファイル、またはSSHで行えます。"
cap2 = "パネルは共有シークレットでノードとペアリングします。すべての呼び出しは署名されます。"
cap3 = "インバウンド設定とクライアントはノード上のXrayに送られます。"
cap4 = "ノードはステータスと負荷を報告し、ページで確認できます。"
cap5 = "ノードが応答しなくなると、パネルがマークを付け、通知することもできます。"

[pages.help.scenes.balancers]
title = "バランサー"
cap1 = "クライアントはノードではなくバランサーに接続します。"
cap2 = "インバウンドのノードに接続を分散します。"
cap3 = "ノードが応答しなくなるとスキップされ、他のノードが負荷を引き受けます。"
cap4 = "ライブグラフにバランサー経由の速度と接続数が表示されます。"
cap5 = "サブスクリプションでは、バランサーのみ、直接ノードのみ、または両方を選べます。"

[pages.help.scenes.bundles]
title = "バンドル"
cap1 = "ホストはクライアントに渡せるエントリーです。"
cap2 = "バンドルはホストを順番に並べたものです。その順序がサブスクリプションの順序になります。"
cap3 = "クライアントはバンドルに参加し、そのホストと各インバウンドへのアクセスを得ます。"
cap4 = "非表示のホストはサブスクリプションに表示されませんが、アクセス権は付与されます。"
cap5 = "クライアントをバンドルから外すと、ノード上のアクセスが取り消されます。"

[pages.help.scenes.hosts]
title = "ホスト"
cap1 = "各ホストは必ず1つのインバウンドに属します。"
cap2 = "ノードホストとバランサーホストはサーバーに自動で追従します。アドレスホストは自分で管理します。"
cap3 = "バンドルがホストを順番にサブスクリプションへまとめます。"
cap4 = "無効なホストはサブスクリプションから消えますが、他は何も変わりません。"

[pages.help.scenes.clients]
title = "クライアント"
cap1 = "クライアントを作成し、トラフィック、有効期限、デバイスなどの制限を設定します。"
cap2 = "クライアントに付与するバンドルを選びます。"
cap3 = "クライアントは1つのサブスクリプションリンクを受け取ります。"
cap4 = "アプリがそれをインポートし、バンドルのすべてのサーバーを表示します。"
cap5 = "制限に達するとアクセスは停止し、延長するまで再開しません。"

[pages.help.scenes.groups]
title = "グループ"
cap1 = "グループは多数のクライアントをまとめるラベルです。"
cap2 = "有効期限、制限、バンドルをグループ全体に1回の操作で設定できます。"
cap3 = "グループのすべてのクライアントに変更が反映されます。"

