helpP4 = "成员权重控制池中每个节点获得的流量比例。手动：您为每个节点自行设置固定权重。自动：按节点负载：面板读取管理员为每个节点设置的上行带宽（节点 → 编辑 → 上行带宽）及其实际上报的吞吐量，给有余量的节点更高权重；未设置带宽的节点会获得较低的回退权重，而不会被排除。自动：按延迟：负载均衡自行测量到每个节点的 TCP 连接延迟，给更近/更快的节点更高权重；无法到达的节点同样回退到较低权重。两种自动模式都按定时器重新计算（设置 → 常规 → 负载均衡自动权重），并会覆盖您在下方手动设置的任何权重。"

