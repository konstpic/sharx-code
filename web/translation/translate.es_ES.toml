[pages.help.scenes.welcome]
title = "Cómo funciona el panel"
cap1 = "Los nodos son tus servidores. Cada uno ejecuta Xray con entradas: un protocolo y un puerto."
cap2 = "Un balanceador es un único punto de entrada delante de varios nodos. Opcional."
cap3 = "Un anfitrión es lo que se entrega al cliente: la dirección y el puerto de un nodo, un balanceador o tu propio dominio."
cap4 = "Un bundle es un conjunto ordenado de anfitriones. El acceso a las entradas proviene de sus anfitriones."
cap5 = "Un cliente se añade a bundles y recibe una sola suscripción con todos sus anfitriones."
cap6 = "El cliente se conecta. El balanceador envía el tráfico a un nodo activo."
cap7 = "Un nodo se cayó: el tráfico pasa al otro y el cliente no nota nada."

[pages.help.scenes.inbounds]
title = "Entradas"
cap1 = "Una entrada es una forma de conectarse: protocolo, puerto y ajustes de transporte."
cap2 = "Asígnala a uno o más nodos: se ejecutará en todos ellos."
cap3 = "El panel envía la configuración a los nodos y la mantiene sincronizada."
cap4 = "Los clientes con acceso se conectan a cualquier nodo de la entrada."

[pages.help.scenes.nodes]
title = "Nodos"
cap1 = "Instala el agente en un servidor: desde el archivo compose para copiar y pegar o por SSH."
cap2 = "El panel se empareja con el nodo mediante un secreto compartido. Cada llamada está firmada."
cap3 = "Los ajustes de la entrada y los clientes se envían a Xray en el nodo."
cap4 = "El nodo informa de su estado y carga, y lo ves en la página."
cap5 = "Si un nodo deja de responder, el panel lo marca y puede notificarte."

[pages.help.scenes.balancers]
title = "Balanceadores"
cap1 = "Los clientes se conectan al balanceador en lugar de a un nodo."
cap2 = "Reparte las conexiones entre los nodos de la entrada."
cap3 = "Un nodo deja de responder: se omite y los demás asumen la carga."
cap4 = "El gráfico en vivo muestra la velocidad y las conexiones a través del balanceador."
cap5 = "En la suscripción eliges: solo balanceador, solo nodos directos o ambos."

[pages.help.scenes.bundles]
title = "Bundles"
cap1 = "Los anfitriones son las entradas que se pueden entregar a un cliente."
cap2 = "Un bundle lista los anfitriones en orden. Ese orden es el de la suscripción."
cap3 = "Los clientes se unen al bundle y reciben sus anfitriones y acceso a sus entradas."
cap4 = "Un anfitrión oculto no aparece en la suscripción, pero sigue dando acceso."
cap5 = "Quita a un cliente del bundle y se le retira el acceso en los nodos."

[pages.help.scenes.hosts]
title = "Anfitriones"
cap1 = "Cada anfitrión pertenece a exactamente una entrada."
cap2 = "Los anfitriones de nodo y de balanceador siguen a sus servidores por sí solos. Los anfitriones de dirección son tuyos."
cap3 = "Los bundles colocan los anfitriones en las suscripciones, en orden."
cap4 = "Un anfitrión deshabilitado desaparece de las suscripciones; nada más cambia."

[pages.help.scenes.clients]
title = "Clientes"
cap1 = "Crea un cliente y define límites: tráfico, vencimiento, dispositivos."
cap2 = "Elige los bundles que recibe el cliente."
cap3 = "El cliente recibe un único enlace de suscripción."
cap4 = "La aplicación lo importa y muestra todos los servidores de los bundles."
cap5 = "Al alcanzar un límite, el acceso se detiene hasta que lo amplíes."

[pages.help.scenes.groups]
title = "Grupos"
cap1 = "Un grupo es una etiqueta para muchos clientes."
cap2 = "Define vencimiento, límites o bundles para todo el grupo en una sola acción."
cap3 = "Todos los clientes del grupo reciben el cambio."

