helpTitle = "Balanceadores"
helpP1 = "Un balanceador es un servidor independiente que ejecuta HAProxy o nginx. Los clientes se conectan a su dirección y este reenvía la conexión a uno de los nodos que sirven la misma entrada. El tráfico no se descifra, por lo que Reality, TLS y los demás protocolos funcionan sin cambios."
helpP2 = "Añade un balanceador, instala el agente en el servidor (docker compose desde la ventana de instalación) y luego coloca detrás las entradas que necesites. Los nodos provienen de los nodos asignados a la entrada; un nodo caído se retira de la rotación automáticamente."
helpP3 = "Para cada entrada eliges qué muestra la suscripción: el balanceador y los nodos directos juntos (en cualquier orden), solo el balanceador o solo los nodos directos."
helpP4 = "El peso de miembro controla cuánto tráfico recibe cada nodo de un grupo. Manual: tú defines un peso fijo por nodo. Auto: por carga del nodo: el panel lee el ancho de banda de subida definido por el administrador de cada nodo (Nodos → editar → Ancho de banda de subida) y su rendimiento real informado, y da más peso a los nodos con margen; un nodo sin ancho de banda definido recibe un peso bajo de respaldo en lugar de quedar excluido. Auto: por ping: el balanceador mide su propia latencia de conexión TCP hacia cada nodo y da más peso a los nodos más cercanos o rápidos; un nodo inaccesible también recibe un peso bajo. Ambos modos automáticos se recalculan con un temporizador (Configuraciones → General → Peso automático del balanceador) y sobrescriben cualquier peso que hayas definido manualmente abajo."

