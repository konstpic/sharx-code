[pages.help.scenes.welcome]
title = "How the panel works"
cap1 = "Nodes are your servers. Each runs Xray with inbounds: a protocol and a port."
cap2 = "A balancer is one entry point in front of several nodes. Optional."
cap3 = "A host is what the client is given: the address and port of a node, a balancer or your own domain."
cap4 = "A bundle is an ordered set of hosts. Access to inbounds comes from its hosts."
cap5 = "A client is put in bundles and receives one subscription with all their hosts."
cap6 = "The client connects. The balancer sends the traffic to a live node."
cap7 = "A node went down: traffic moves to the other one, the client notices nothing."

[pages.help.scenes.inbounds]
title = "Inbounds"
cap1 = "An inbound is a way to connect: protocol, port and transport settings."
cap2 = "Assign it to one or more nodes: it will run on all of them."
cap3 = "The panel pushes the configuration to the nodes and keeps it in sync."
cap4 = "Clients that have access connect to any node of the inbound."

[pages.help.scenes.nodes]
title = "Nodes"
cap1 = "Install the agent on a server: from the copy-paste compose file or over SSH."
cap2 = "The panel pairs with the node with a shared secret. Every call is signed."
cap3 = "Inbound settings and clients go to Xray on the node."
cap4 = "The node reports its status and load, you see it on the page."
cap5 = "If a node stops answering, the panel marks it and can notify you."

[pages.help.scenes.balancers]
title = "Balancers"
cap1 = "Clients connect to the balancer instead of a node."
cap2 = "It spreads connections over the nodes of the inbound."
cap3 = "A node stops responding: it is skipped, the others take the load."
cap4 = "The live graph shows speed and connections through the balancer."
cap5 = "In the subscription you choose: balancer only, direct nodes only, or both."

[pages.help.scenes.bundles]
title = "Bundles"
cap1 = "Hosts are the entries a client can be given."
cap2 = "A bundle lists hosts in order. That order is the subscription order."
cap3 = "Clients join the bundle and get its hosts and access to their inbounds."
cap4 = "A hidden host is not listed in the subscription but still gives access."
cap5 = "Remove a client from the bundle and access is taken away on the nodes."

[pages.help.scenes.hosts]
title = "Hosts"
cap1 = "Every host belongs to exactly one inbound."
cap2 = "Node hosts and balancer hosts follow their servers by themselves. Address hosts are yours."
cap3 = "Bundles put the hosts into subscriptions, in order."
cap4 = "A disabled host disappears from subscriptions; nothing else changes."

[pages.help.scenes.clients]
title = "Clients"
cap1 = "Create a client and set limits: traffic, expiry, devices."
cap2 = "Choose the bundles the client gets."
cap3 = "The client gets one subscription link."
cap4 = "The app imports it and shows all servers of the bundles."
cap5 = "When a limit is reached, access stops until you extend it."

[pages.help.scenes.groups]
