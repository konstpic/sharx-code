helpP4 = "Вага учасника визначає, скільки трафіку отримує кожна нода в пулі. Вручну: ви самі задаєте фіксовану вагу для кожної ноди. Авто: за навантаженням ноди: панель зчитує задану адміністратором пропускну здатність аплінка кожної ноди (Ноди → редагувати → Пропускна здатність аплінка) та її фактичну повідомлену пропускну здатність і надає більшу вагу нодам із запасом; нода без заданої пропускної здатності отримує низьку резервну вагу замість виключення. Авто: за пінгом: балансувальник сам вимірює затримку TCP-підключення до кожної ноди й надає більшу вагу ближчим/швидшим нодам; недосяжна нода також отримує низьку резервну вагу. Обидва авто-режими перераховуються за таймером (Параметри → Загальні → Автоваги балансувальника) і перезаписують будь-яку вагу, задану нижче вручну."

