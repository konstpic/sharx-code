helpP1 = "Балансувальник — це окремий сервер із HAProxy або nginx. Клієнти підключаються до його адреси, а він пересилає з'єднання на одну з нод, що обслуговують той самий вхідний. Трафік не розшифровується, тож Reality, TLS та інші протоколи працюють без змін."
