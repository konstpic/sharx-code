helpP2 = "أضف موازنًا، وثبّت الوكيل على الخادم (docker compose من نافذة التثبيت)، ثم ضع الإدخالات التي تحتاجها خلفه. تأتي العقد من العقد المعيّنة للإدخال؛ وتُسقط العقدة الفاشلة من التدوير تلقائيًا."
helpP3 = "لكل إدخال تختار ما يعرضه الاشتراك: الموازن والعقد المباشرة معًا (بأي ترتيب)، أو الموازن فقط، أو العقد المباشرة فقط."
helpP4 = "يتحكم وزن العضو في مقدار الترافيك الذي تناله كل عقدة في المجمّع. يدوي: تحدد وزنًا ثابتًا لكل عقدة بنفسك. تلقائي: حسب حمل العقدة: تقرأ اللوحة عرض نطاق الرفع الذي حدده المسؤول لكل عقدة (العقد ← تعديل ← عرض نطاق الرفع) والإنتاجية الفعلية المبلَّغ عنها، وتعطي وزنًا أكبر للعقد ذات الهامش؛ والعقدة بلا عرض نطاق تأخذ وزنًا احتياطيًا منخفضًا بدل استبعادها. تلقائي: حسب Ping: يقيس الموازن تأخير اتصال TCP الخاص به إلى كل عقدة ويعطي وزنًا أكبر للعقد الأقرب/الأسرع؛ والعقدة غير القابلة للوصول تأخذ وزنًا منخفضًا أيضًا. يُعاد حساب الوضعين التلقائيين بمؤقت (الإعدادات ← عام ← الوزن التلقائي للموازن) ويستبدلان أي وزن ضبطته يدويًا أدناه."

