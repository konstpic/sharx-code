[pages.help.scenes.welcome]
title = "كيف تعمل اللوحة"
cap1 = "العقد هي خوادمك. على كل منها Xray مع إدخالات: بروتوكول ومنفذ."
cap2 = "الموازن نقطة دخول واحدة أمام عدة عقد. اختياري."
cap3 = "المضيف هو ما يُعطى للعميل: عنوان ومنفذ عقدة أو موازن أو نطاقك الخاص."
cap4 = "الحزمة مجموعة مرتبة من المضيفين. يأتي الوصول إلى الإدخالات من مضيفيها."
cap5 = "يُضاف العميل إلى حزم ويتلقى اشتراكًا واحدًا بكل مضيفيه."
cap6 = "يتصل العميل. يرسل الموازن الترافيك إلى عقدة تعمل."
cap7 = "سقطت عقدة: ينتقل الترافيك إلى الأخرى ولا يلاحظ العميل شيئًا."

[pages.help.scenes.inbounds]
title = "الإدخالات"
cap1 = "الإدخال طريقة اتصال: بروتوكول ومنفذ وإعدادات النقل."
cap2 = "عيّنه لعقدة أو أكثر: سيعمل على جميعها."
cap3 = "ترسل اللوحة الإعدادات إلى العقد وتبقيها متزامنة."
cap4 = "العملاء أصحاب الوصول يتصلون بأي عقدة من الإدخال."

[pages.help.scenes.nodes]
title = "العقد"
cap1 = "ثبّت الوكيل على الخادم: من ملف compose الجاهز للنسخ أو عبر SSH."
cap2 = "تقترن اللوحة بالعقدة بسر مشترك. كل طلب موقَّع."
cap3 = "تذهب إعدادات الإدخال والعملاء إلى Xray على العقدة."
cap4 = "تبلغ العقدة عن حالتها وحملها وتراها في الصفحة."
cap5 = "إذا توقفت عقدة عن الرد، تعلّمها اللوحة ويمكنها تنبيهك."

[pages.help.scenes.balancers]
