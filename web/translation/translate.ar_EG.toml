cap1 = "يتصل العملاء بالموازن بدلًا من العقدة."
cap2 = "يوزع الاتصالات على عقد الإدخال."
cap3 = "توقفت عقدة عن الاستجابة: تُتخطى وتتحمل الأخرى الحمل."
cap4 = "يعرض الرسم المباشر السرعة والاتصالات عبر الموازن."
cap5 = "في الاشتراك تختار: الموازن فقط، أو العقد المباشرة فقط، أو كليهما."

[pages.help.scenes.bundles]
title = "الحزم"
cap1 = "المضيفون هم المداخل التي يمكن إعطاؤها للعميل."
cap2 = "تسرد الحزمة المضيفين بالترتيب. هذا الترتيب هو ترتيب الاشتراك."
cap3 = "ينضم العملاء إلى الحزمة ويحصلون على مضيفيها والوصول إلى إدخالاتهم."
cap4 = "المضيف المخفي لا يظهر في الاشتراك لكنه يمنح الوصول."
cap5 = "أزل عميلًا من الحزمة فيُسحب وصوله على العقد."

[pages.help.scenes.hosts]
